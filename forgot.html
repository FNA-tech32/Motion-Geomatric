<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

   <link rel="stylesheet" href="assets/css/style3.css">
   <!-- Tailwind CSS -->
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
     tailwind.config = {
       corePlugins: {
         preflight: false,
       },
       theme: {
         extend: {
           colors: {
             brand: {
               red: '#ef4444',
               darkred: '#dc2626',
               navy: '#0f172a',
               accent: '#f97316'
             }
           }
         }
       }
     }
   </script>

   <title>Motion Geomatric - Forgot Password</title>
</head>
<body>
   <div class="login">
      <img src="assets/images/hero-banner.jpg" alt="register image" class="login__img">

      <form action="" class="login__form" name="Formfill" onsubmit="return validation()">
         <h1 class="login__title">Forgot Password</h1>

         <p id="result" style="color: rgb(255, 255, 255); text-align: center; margin-bottom: 1rem;font-weight: 300;font-size: 1.6rem;">Enter Your Registered Email Address</p>

         <div class="login__content">
            <div class="login__box">
               <i class="ri-mail-line login__icon"></i>

               <div class="login__box-input">
                  <input type="email" required class="login__input" id="register-email" placeholder=" ">
                  <label for="register-email" class="login__label">Email</label>
               </div>
            </div>
         </div>

         <button type="submit" class="login__button">Confirm Reset</button>
         <p style="text-align: center; margin-top: -1rem; margin-bottom: 1.5rem;"><a href="index.html" style="color: #cbd5e1; font-size: 0.85rem;">&larr; Back to Home Page</a></p>

         <p class="login__register">
            Remember your password? <a href="login.html">Login</a>
         </p>
      </form>

      <div class="popup" id="popup">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <h2>Instructions Sent!</h2>
        <p>A password reset link has been sent to your email.</p>
        <a href="login.html"><button type="button">Back to Login</button></a>
      </div>
   </div>

   <!--=============== MAIN JS ===============-->
   <script src="assets/js/script4.js"></script>
</body>
</html>
